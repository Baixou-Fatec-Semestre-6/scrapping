services:
  scraper-worker:
    build: .
    container_name: baixou_scraper_worker
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_URL: ""
      RABBITMQ_HOST: core_rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${CORE_RABBITMQ_USER:-baixou_app}
      RABBITMQ_PASSWORD: ${CORE_RABBITMQ_PASSWORD:-local_dev_password}
      RABBITMQ_EXCHANGE: baixou
      RABBITMQ_QUEUE_REQUESTS: scraper.requests
      RABBITMQ_EXCHANGE_RETRY: baixou.retry
      RABBITMQ_EXCHANGE_DLX: baixou.dlx
    networks:
      - core

networks:
  core:
    external: true
    name: ${CORE_DOCKER_NETWORK:-docker_core}
